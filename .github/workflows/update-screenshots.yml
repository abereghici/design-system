name: Update screenshots

on: workflow_dispatch

jobs:
  update-screenshots:
    if: github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - run: apt-get update && apt-get install --yes --no-install-recommends git-lfs
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: pnpm/setup@v3
        with:
          require-lockfile: true
      - run: pnpm --filter @platform/tokens build
      - run: rm -rf packages/ui/__screenshots__
      - run: pnpm --filter @platform/ui test:screenshots --update
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all packages/ui/__screenshots__
          git diff --cached --quiet || git commit -m "test(ui): update story screenshot baselines" -m "Co-authored-by: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>"
          git push origin "HEAD:${{ github.ref_name }}"
