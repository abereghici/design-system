name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          require-lockfile: true
          cache: true
      - run: pnpm --filter @abereghici/ui exec playwright install --with-deps chromium firefox webkit
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm test:packed
