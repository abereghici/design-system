# Lint, types and tests (Vitest, Storybook story tests in three engines, size budgets).
# Story screenshots run separately, in the Playwright image: visual.yml.
name: CI

on:
  # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
  push:
    branches: [main]
  pull_request:

# "it is recommended to set the following `GITHUB_TOKEN` permissions" (actions/checkout v7.0.1 README).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Installs pnpm and Node.js from `devEngines` in package.json ("If your `package.json` declares
      # `devEngines.runtime`, the action picks up every runtime and version from there
      # automatically") and runs `pnpm install --frozen-lockfile` (`require-lockfile`).
      # https://github.com/pnpm/setup/blob/v3.1.1/README.md
      - uses: pnpm/setup@v3
        with:
          require-lockfile: true
      # "Install Playwright Browsers: npx playwright install --with-deps" (Playwright 1.64.1
      # docs/src/ci.md), through the workspace's pinned Playwright.
      - run: pnpm --filter @platform/ui exec playwright install --with-deps
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test
