name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          require-lockfile: true
      - run: pnpm --filter @platform/ui exec playwright install --with-deps
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test
