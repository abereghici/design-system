name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisories are published between pushes; Dependabot can't read pnpm 12's two-document lockfile.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true
          cache: true
      - run: pnpm audit
      - run: pnpm --filter @abereghici/ui exec playwright install --with-deps chromium firefox webkit
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm test:packed
