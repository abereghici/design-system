# Story screenshots: every story, in every variant, compared with the committed baselines.
# Baselines are only written by update-screenshots.yml. Locally: `pnpm --filter @platform/ui
# test:screenshots:docker` runs the same thing in the same image.
name: Visual

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    # "GitHub Actions support running jobs in a container … to have a consistent environment for
    # e.g. screenshots/visual regression testing" (Playwright 1.64.1 docs/src/ci.md). Keep the tag
    # equal to the catalog's `playwright` version in pnpm-workspace.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      # The image has Git but not Git LFS, which holds the baselines (.gitattributes).
      - run: apt-get update && apt-get install --yes --no-install-recommends git-lfs
      # `lfs`: "Whether to download Git-LFS files" (actions/checkout v7.0.1 README).
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: pnpm/setup@v3
        with:
          require-lockfile: true
      # GitHub sets `CI`, so the update mode is `none`: Vitest "does not write snapshots and fails
      # on snapshot mismatches, missing snapshots" (https://vitest.dev/config/update).
      - run: pnpm --filter @platform/tokens build
      - run: pnpm --filter @platform/ui test:screenshots
      # The HTML report and the reference/actual/diff images (`.vitest/`). "upload the output
      # directory as an artifact" (https://vitest.dev/guide/ui). `.vitest` is a hidden directory,
      # and hidden files are left out unless `include-hidden-files` (actions/upload-artifact
      # v7.0.2 README).
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: story-screenshots-report
          path: packages/ui/.vitest/
          include-hidden-files: true
          retention-days: 30
