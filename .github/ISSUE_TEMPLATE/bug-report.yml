name: Bug report
description: Something in a component or token doesn't work as documented.
labels: [bug, needs-triage]
body:
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: "@abereghici/ui@0.1.2"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal example, or the Storybook story that shows it.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and framework
      placeholder: Chrome 148, Next.js 16.4
