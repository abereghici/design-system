packages:
  - apps/*
  - packages/*

catalogMode: strict
catalogPrune: true
trustPolicy: no-downgrade

# semver 6.3.1 (via react-docgen > @babel/core) fails `trustPolicy: no-downgrade`.
trustPolicyExclude:
  - semver@6.3.1

# pnpm already installs esbuild's platform binary; its postinstall only re-checks it.
allowBuilds:
  esbuild: false

catalog:
  "@stylistic/eslint-plugin": 5.10.0
  "@size-limit/esbuild": 14.3.0
  "@size-limit/file": 14.3.0
  "@storybook/addon-a11y": 10.6.3
  "@storybook/addon-docs": 10.6.3
  "@storybook/addon-mcp": 10.6.1
  "@storybook/addon-vitest": 10.6.3
  "@storybook/react-vite": 10.6.3
  "@total-typescript/ts-reset": 0.6.1
  "@types/node": 26.6.5
  "@types/react": 19.3.0
  "@types/fontkit": 2.0.9
  "@types/react-dom": 19.3.0
  "@babel/core": 7.29.7
  "@rolldown/plugin-babel": 0.2.4
  "@types/subset-font": 2.3.0
  "@vitejs/plugin-react": 6.1.2
  "@vitest/browser-playwright": 5.0.5
  "@vitest/coverage-v8": 5.0.5
  "@vitest/ui": 5.0.5
  babel-plugin-react-compiler: 1.0.0
  fflate: 0.8.3
  fontkit: 2.0.4
  next: 16.4.3
  oxfmt: 0.74.0
  oxlint: 1.89.0
  oxlint-tsgolint: 7.0.2004
  playwright: 1.64.1
  react: 19.3.1
  react-dom: 19.3.1
  remark-gfm: 4.0.1
  size-limit: 14.3.0
  storybook: 10.6.3
  style-dictionary: 5.7.0
  subset-font: 2.9.0
  svgo: 4.1.0
  temporal-polyfill: 1.0.6
  turbo: 2.11.10
  typescript: 7.0.2
  vite: 8.3.5
  vitest: 5.0.5
  web-features: 3.44.0
  "@tsdown/css": 0.23.4
  tsdown: 0.23.4
  "@changesets/cli": 3.0.3
  rolldown: 1.2.15
minimumReleaseAgeExclude:
