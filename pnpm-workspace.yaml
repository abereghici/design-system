packages:
  - apps/*
  - packages/*

catalogMode: strict
catalogPrune: true
trustPolicy: no-downgrade

# semver@6 fails `trustPolicy: no-downgrade` (via react-docgen > @babel/core), so pin the trusted 7.x line.
overrides:
  "semver@^6": 7.8.5

# pnpm already installs esbuild's platform binary; its postinstall only re-checks it.
allowBuilds:
  esbuild: false

catalog:
  "@size-limit/esbuild": 14.3.0
  "@size-limit/file": 14.3.0
  "@storybook/addon-a11y": 10.6.3
  "@storybook/addon-docs": 10.6.3
  "@storybook/addon-mcp": 10.6.1
  "@storybook/addon-vitest": 10.6.3
  "@storybook/react-vite": 10.6.3
  "@total-typescript/ts-reset": 0.6.1
  "@types/node": 26.6.5
  "@types/react": 19.3.0
  "@types/fontkit": 2.0.9
  "@types/react-dom": 19.3.0
  "@types/subset-font": 2.3.0
  "@vitejs/plugin-react": 6.1.2
  "@vitest/browser-playwright": 5.0.5
  "@vitest/ui": 5.0.5
  babel-plugin-react-compiler: 1.0.0
  fflate: 0.8.3
  fontkit: 2.0.4
  next: 16.4.3
  oxfmt: 0.74.0
  oxlint: 1.89.0
  oxlint-tsgolint: 7.0.2004
  playwright: 1.64.1
  react: 19.3.1
  react-dom: 19.3.1
  remark-gfm: 4.0.1
  size-limit: 14.3.0
  storybook: 10.6.3
  storybook-addon-pseudo-states: 10.6.1
  style-dictionary: 5.7.0
  subset-font: 2.9.0
  svgo: 4.1.0
  turbo: 2.11.10
  typescript: 7.0.2
  vite: 8.3.5
  vitest: 5.0.5

minimumReleaseAgeExclude:
  - "@next/env@16.4.3"
  - "@next/swc-darwin-arm64@16.4.3"
  - "@next/swc-darwin-x64@16.4.3"
  - "@next/swc-linux-arm64-gnu@16.4.3"
  - "@next/swc-linux-arm64-musl@16.4.3"
  - "@next/swc-linux-x64-gnu@16.4.3"
  - "@next/swc-linux-x64-musl@16.4.3"
  - "@next/swc-win32-arm64-msvc@16.4.3"
  - "@next/swc-win32-x64-msvc@16.4.3"
  - next@16.4.3
